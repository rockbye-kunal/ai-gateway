name: Feature request
description: Suggest something the gateway should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the problem, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work, including any config or API you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other tools you've looked at.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
