# AI gateway configuration.
# Any string can reference environment variables: ${NAME} or ${NAME:-default}.
# Keep secrets in env vars or your secret manager, never in this file.

server:
  listen: 0.0.0.0:8080            # public API (put TLS on the load balancer in front)
  admin_listen: 0.0.0.0:9090      # /metrics, /healthz, /readyz — private network only
  max_body_bytes: 10485760        # 10 MiB, enough for a few base64 images
  request_timeout_secs: 600       # time to first byte; streams use stream_idle_timeout_secs
  max_concurrent_requests: 1024   # per instance; over this, clients get 503 + Retry-After
  shutdown_drain_secs: 10         # /readyz fails this long before the listener closes
  shutdown_grace_secs: 120        # time for in-flight streams to finish on shutdown

store:
  backend: redis                  # redis for multiple replicas, memory for a single instance
  redis_url: ${REDIS_URL}         # use rediss:// for TLS
  key_prefix: "aigw:"
  op_timeout_ms: 250
  on_error: closed                # closed = reject when Redis is down (protects spend)
                                  # open   = serve without limits when Redis is down

cache:
  enabled: true                   # identical non-streaming requests, per API key
  ttl_secs: 300
  max_entry_bytes: 1048576

# Dashboard and admin API on admin_listen. Off until token_sha256 is set.
# Create a token with `ai-gateway generate-key`; put only its hash here.
admin:
  # token_sha256: ${ADMIN_TOKEN_SHA256}
  key_refresh_secs: 5             # replicas pick up dashboard keys, rules and provider keys this often
  # encryption_key: ${GATEWAY_ENCRYPTION_KEY}   # `ai-gateway generate-encryption-key`; lets the
                                  # dashboard store provider keys (encrypted) instead of this file

logging:
  enabled: true
  max_entries: 10000              # searchable request log, shared by all replicas
  capture_bodies: false           # true stores prompts and responses (may contain personal data)
  max_body_bytes: 32768
  detail_ttl_secs: 604800         # 7 days
  report_retention_days: 90       # hourly usage reports by key, user, tag, model, provider
  # export:                       # ship every log entry as NDJSON batches ("logpush")
  #   url: https://logs.example.com/ingest
  #   headers: {Authorization: "Bearer ${LOG_TOKEN}"}
  #   include_bodies: false
  # otlp:                         # one OpenTelemetry trace per request
  #   endpoint: http://otel-collector:4318
  #   service_name: ai-gateway

guardrails:
  rules:
    - name: no-cards
      builtin: credit_card        # Luhn-checked
      action: block               # block | redact | flag
      apply_to: request           # request | response | both
    - name: secrets
      builtin: api_key
      action: redact
    # - name: emails
    #   builtin: email
    #   action: redact
    # - name: injection
    #   builtin: prompt_injection
    #   action: flag
    # - name: unsafe                # a moderation model; needs an openai-kind provider
    #   moderation:
    #     provider: openai
    #     categories: [violence, hate, self-harm, sexual]
    #   action: block
    #   apply_to: request

# Request, token and spend limits. Over a limit: 429 until the window resets.
limits:
  - name: per-user-requests
    kind: requests                # requests | tokens | cost (USD)
    limit: 120
    window: minute                # minute | hour | day | week | month (UTC)
    per: user                     # global | key | user | model | provider | metadata.<name>
    sliding: true
  - name: daily-spend-per-key
    kind: cost
    limit: 100
    window: day
    per: key

# Rewrite or block models before routing. Also editable live in the dashboard.
routing_rules:
  - source: openai/gpt-3.5-turbo
    action: rewrite
    destination: openai/gpt-4o-mini

# Signed webhook for limit thresholds and provider circuit-breaker trips.
# alerts:
#   webhook_url: https://hooks.example.com/ai-gateway
#   webhook_secret: ${ALERT_SECRET}
#   thresholds: [0.8, 1.0]

# Every request goes through OpenRouter unless it names a route below.
# Clients pick any OpenRouter model per request, e.g. "openai/gpt-4o-mini",
# "anthropic/claude-haiku-4.5", "google/gemini-2.5-flash",
# "meta-llama/llama-3.3-70b-instruct". See https://openrouter.ai/models
default_provider: openrouter

providers:
  openrouter:
    kind: openai                  # OpenRouter speaks the OpenAI API
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    timeout_secs: 120
    stream_idle_timeout_secs: 90  # OpenRouter sends keep-alive comments while a model warms up
    max_retries: 2
    breaker_failure_threshold: 5
    breaker_open_secs: 30
    # zero_data_retention: true   # only if your account has ZDR; ZDR requests go only to such providers
    # no_prompt_training: true
    # allow_client_keys: true     # clients may send their own key (providerOptions.gateway.byok)
    # extra_headers:              # optional: identifies your app in OpenRouter analytics
    #   HTTP-Referer: https://your-site.example
    #   X-Title: Your App Name

  # Direct provider accounts are optional. Uncomment to call a provider
  # directly as "<name>/<model>" or in route targets.
  # openai:
  #   kind: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}
  # anthropic:
  #   kind: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key: ${ANTHROPIC_API_KEY}
  #   default_max_tokens: 4096
  #   auto_prompt_cache: true     # add prompt-caching markers automatically
  # azure:
  #   kind: azure                 # route target `model` is the deployment name
  #   base_url: https://YOUR-RESOURCE.openai.azure.com/openai/deployments
  #   api_key: ${AZURE_OPENAI_API_KEY}
  #   api_version: "2024-10-21"

# Routes are stable names clients can use instead of raw model names. Targets
# are tried in order: retries happen on each target, then the next target is
# the fallback. Here every fallback is a different model or upstream provider,
# all reached through OpenRouter.
routes:
  - name: default
    targets:
      - provider: openrouter
        model: openai/gpt-4o-mini
      - provider: openrouter
        model: google/gemini-2.5-flash
  - name: fast
    strategy: latency             # fastest first by recent time to first token
    targets:
      - provider: openrouter
        model: google/gemini-2.5-flash
      - provider: openrouter
        model: openai/gpt-4o-mini
  - name: smart
    strategy: weighted            # 80/20 A/B split; the other target is still the fallback
    targets:
      - provider: openrouter
        model: anthropic/claude-sonnet-4.5
        weight: 80
      - provider: openrouter
        model: openai/gpt-4o
        weight: 20

# Client keys. Create with `ai-gateway generate-key`; store only the hash here.
keys:
  - name: acme-prod
    key_sha256: "REPLACE_WITH_64_HEX_CHARS_FROM_generate-key_0000000000000000000000"
    previous_key_sha256: []                # old hashes still accepted during a key rotation
    requests_per_minute: 600
    daily_token_budget: 20000000
    max_concurrent_requests: 200           # per instance, so one client can't use all capacity
    # Route names, "openrouter/*" (any OpenRouter model), a single model such as
    # "openrouter/anthropic/claude-haiku-4.5", or "*" for everything.
    allowed_models: ["default", "fast", "smart", "openrouter/*"]
    zero_data_retention: false             # true: never store or cache prompts; ZDR providers only
