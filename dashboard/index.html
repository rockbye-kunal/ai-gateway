<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Gateway</title>
<link rel="icon" href="data:,">
<style>
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17222e;
  --muted: #5d6b79;
  --rule: #d5dce3;
  --rule-strong: #b9c3cd;
  --traffic: #2f5d8a;
  --traffic-soft: #c9d8e7;
  --error: #b5413b;
  --error-soft: #f3d9d6;
  --tokens: #2a8c82;
  --cost: #a97a1e;
  --ok: #2f7d4f;
  --focus: #2f5d8a;
  --radius-s: 4px;
  --radius-m: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151b22;
    --surface: #1c242e;
    --ink: #dce3ea;
    --muted: #93a1af;
    --rule: #2b3642;
    --rule-strong: #3b4856;
    --traffic: #7fa9d4;
    --traffic-soft: #2c4258;
    --error: #e07a72;
    --error-soft: #4a2826;
    --tokens: #5cc2b6;
    --cost: #d8ae55;
    --ok: #6cc08e;
    --focus: #9cc0e6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.5 "IBM Plex Sans", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--traffic); }
.hidden { display: none !important; }

/* Shell */
.shell { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
.rail {
  border-right: 1px solid var(--rule);
  padding: 20px 12px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
}
.brand { font-weight: 650; font-size: 15px; padding: 0 10px 18px; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.rail a {
  display: block; padding: 7px 10px; border-radius: var(--radius-s);
  text-decoration: none; color: var(--muted);
}
.rail a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--traffic); }
.rail a:hover { color: var(--ink); }
.rail .spacer { flex: 1; }
.rail button.link { background: none; border: 0; text-align: left; padding: 7px 10px; color: var(--muted); cursor: pointer; }
main { padding: 24px 32px 48px; min-width: 0; max-width: 1400px; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 13px; }

/* Controls */
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--traffic); color: #fff; }
.btn {
  border: 1px solid var(--rule-strong); background: var(--surface); border-radius: var(--radius-s);
  padding: 6px 12px; cursor: pointer;
}
.btn.primary { background: var(--traffic); border-color: var(--traffic); color: #fff; }
.btn.danger { color: var(--error); border-color: var(--error); background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=url], input[type=number], input[type=password], input[type=search], input[type=date], select {
  border: 1px solid var(--rule-strong); background: var(--surface); border-radius: var(--radius-s); padding: 6px 9px;
  min-width: 0;
}
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.field input { color: var(--ink); }

/* Traffic strip */
.strip { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 16px 16px 8px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
canvas.chart { width: 100%; display: block; }

/* Figures band */
.band {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border-top: 1px solid var(--rule); margin-top: 8px;
}
.fig { padding: 14px 16px 10px; border-left: 1px solid var(--rule); }
.fig:first-child { border-left: 0; padding-left: 0; }
.fig .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.fig .k { color: var(--muted); font-size: 12.5px; }
.fig .d { color: var(--muted); font-size: 12px; }
.fig.bad .v { color: var(--error); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 14px 16px; min-width: 0; }
.panel.flush { padding: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel.flush h2 { padding: 14px 16px 0; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
td.num, th.num { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--traffic) 6%, transparent); }
td.trunc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; margin-top: 4px; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--traffic); border-radius: 2px; }
.bar.warn > span { background: var(--error); }

.pill { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; line-height: 19px; border: 1px solid var(--rule-strong); color: var(--muted); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.pill.err { color: var(--error); border-color: color-mix(in srgb, var(--error) 50%, transparent); background: var(--error-soft); }
.pill.flag { color: var(--cost); border-color: color-mix(in srgb, var(--cost) 50%, transparent); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input[type=search] { width: 260px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 26, .35); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw);
  background: var(--surface); border-left: 1px solid var(--rule); padding: 20px 22px; overflow-y: auto;
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.drawer header { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 14px; }
dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0 0 18px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; word-break: break-word; }
pre.body {
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-s);
  padding: 12px; font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; margin: 0 0 16px;
}

/* Modal */
.modal {
  position: fixed; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(520px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius-m); padding: 20px 22px; box-shadow: 0 18px 48px rgba(10, 18, 26, .25);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.form-grid .wide { grid-column: 1 / -1; }
.secret { display: flex; gap: 8px; margin: 12px 0; }
.secret input { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Login */
.login { max-width: 400px; margin: 14vh auto; padding: 0 16px; }
.login h1 { margin-bottom: 6px; }
.login form { display: grid; gap: 12px; margin-top: 18px; }

.notice { padding: 10px 14px; border-radius: var(--radius-s); border: 1px solid var(--rule-strong); background: var(--surface); margin-bottom: 14px; }
.notice.err { border-color: var(--error); color: var(--error); background: var(--error-soft); }
.empty { color: var(--muted); padding: 22px 16px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.prov { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 12px 14px; }
.prov .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.prov .meta { color: var(--muted); font-size: 12.5px; word-break: break-all; }
table.mini { margin-top: 8px; table-layout: fixed; font-size: 12px; }
table.mini td { padding: 4px 4px; }
table.mini td:first-child { width: 44%; white-space: normal; word-break: break-all; }
table.mini td.num { white-space: nowrap; }

.tooltip {
  position: fixed; pointer-events: none; background: var(--ink); color: var(--paper);
  padding: 6px 9px; border-radius: var(--radius-s); font-size: 12px; z-index: 50; white-space: nowrap;
}

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); padding: 10px 12px; }
  .brand { padding: 6px 10px; }
  .rail .spacer { display: none; }
  main { padding: 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .fig:first-child { padding-left: 16px; }
  .fig { border-left: 0; border-top: 1px solid var(--rule); }
  .form-grid { grid-template-columns: 1fr; }
  .filters input[type=search] { width: 100%; }
  dl.kv { grid-template-columns: 1fr; }
}
.actions-cell { white-space: nowrap; text-align: right; }
details.more { border-top: 1px solid var(--rule); }
details.more summary { cursor: pointer; padding: 10px 16px; color: var(--muted); font-size: 13px; }
details.more[open] summary { border-bottom: 1px solid var(--rule); }
textarea { font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--radius-s); padding: 8px; width: 100%; resize: vertical; }
td button.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--traffic); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; text-align: left; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tooltip" class="tooltip hidden" role="status"></div>
<script src="/assets/app.js"></script>
</body>
</html>
