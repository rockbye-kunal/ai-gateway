events {}

http {
  upstream gateway {
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;
    client_max_body_size 10m;

    # Realtime API: WebSocket upgrade, long-lived sessions.
    location /v1/realtime {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Retry on another replica only when this one could not take the request
      # (connection refused while it restarts, or 503 when it is at capacity).
      # Both are safe for POSTs because the gateway never started the work.
      proxy_next_upstream error http_503 non_idempotent;
      proxy_next_upstream_tries 2;
      # Streaming: don't buffer SSE and allow long generations.
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
