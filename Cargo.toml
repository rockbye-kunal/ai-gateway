[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Self-hosted AI gateway: one OpenAI-compatible API in front of OpenAI, Anthropic, Azure OpenAI, AWS Bedrock, Google Vertex AI and other providers"
repository = "https://github.com/rockbye-kunal/ai-gateway"
readme = "README.md"
publish = false

[lib]
name = "ai_gateway"
path = "src/lib.rs"

[[bin]]
name = "ai-gateway"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dashmap = "6"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
parking_lot = "0.12"
rand = "0.8"
regex = "1"
ring = "0.17"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["catch-panic", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep unwinding so a panic in one request is caught and turned into a 500
# instead of taking the whole process down.
panic = "unwind"
